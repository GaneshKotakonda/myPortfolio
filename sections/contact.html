<section id="contact" class="section-padding px-4 sm:px-6 md:px-8 lg:px-10 xl:px-12">
  <div class="max-w-6xl xl:max-w-7xl mx-auto">
    <div class="section-header">
      <h2 class="section-title">Contact</h2>
      <p class="section-subtitle">Let's connect and build something great</p>
    </div>
    <div class="grid md:grid-cols-2 lg:grid-cols-5 gap-6 lg:gap-8">
      <div class="lg:col-span-2 space-y-4">
        <a href="mailto:k.ganeshreddy038@gmail.com" class="contact-card hover-lift">
          <span class="icon-box">Email</span>
          <span class="text-white font-medium break-all">k.ganeshreddy038@gmail.com</span>
        </a>
        <a href="https://github.com/GaneshKotakonda" class="contact-card hover-lift">
          <span class="icon-box">Git</span>
          <span class="text-white font-medium">GaneshKotakonda</span>
        </a>
      </div>
      <form class="card hover-lift space-y-5 md:col-span-2 lg:col-span-3" action="mailto:k.ganeshreddy038@gmail.com" method="post" enctype="text/plain">

          <div>
            <label for="fragment-name" class="form-label">Name</label>

          </div>
        </div>
        <div>
          <label for="fragment-message" class="form-label">Message</label>
          <textarea id="fragment-message" name="message" rows="5" placeholder="Your message..." class="form-input resize-none" required></textarea>
        </div>
        <button type="submit" class="btn-primary w-full sm:w-auto">Send Message</button>
      </form>
    </div>
  </div>
</section>
